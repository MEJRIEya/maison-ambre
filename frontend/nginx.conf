server {
    listen 80;
    root /usr/share/nginx/html;

    # Same origin for the app and the API: no CORS needed.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Client-side routes (/cart, /insights, ...) all load index.html.
    location / {
        try_files $uri /index.html;
    }
}
